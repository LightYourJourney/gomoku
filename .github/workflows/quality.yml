# 质量门禁。
#
# 分两层（见 docs/superpowers/specs/2026-10-13-quality-gates-design.md）：
#   fast   —— 与本地 pre-push 钩子**同一批脚本**，所以「本地绿、CI 红」只可能是环境差异
#   全档   —— e2e / e2e:prod / 探针 / 基准，本地钩子跑不动（太慢），只有 CI 跑
#
# **快档不含 e2e 与探针**。所以「推得出去」不等于「安全网没缩水」——
# 改了界面结构、布局或扫描范围的人，要看全档这几个 job。
#
# 拆成互不相同的 job 而不是一个大 job，理由是**报错要能归因**：
#   bench 是唯一对机器速度敏感的判据，和别人挤一台机器会把「机器忙」误报成「算法变慢」
#   probe 自己起 dev server（5184）、跑几分钟，失败原因要单独可见
#   e2e   最可能因为**环境**（滚动条宽度、字体）而不是代码变红
name: quality

on: [push, pull_request]

jobs:
  # 与 .githooks/pre-push 同口径。首跑实测 166 秒。
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与本地一致（本机 v26.11.1）。仓库没有版本固定文件，这里就是唯一的钉子。
          # 首跑已证实 runner 上取得到。
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn gates

  e2e:
    runs-on: ubuntu-latest
    # 本地 102 条跑 2.4 分钟；runner 上留足余量。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile
      # 这个应用的中文走**系统字体栈**（src/index.css 的 --font-sans 里是 PingFang SC /
      # Noto Sans SC 等，仓库没有内置字体）。runner 上一个中文字体都没有的话，
      # 中文会以回退字形渲染——**那不是任何真实 Linux 用户看到的界面**，
      # 而横向度量（两个字有多宽）会随之改变。首跑实测：这一条让 `复盘` 标题
      # 从 macOS 的 40px 变成 30px、教学页高度变化导致可滚动距离从 >100px 变成 81px。
      # 装字体而不是调小断言：调小断言会把「安全网缩水」写进历史。
      - name: 装中文字体，并记下实际可用的（让文本度量与真实 Linux 桌面一致）
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq fonts-noto-cjk; then
            echo "::error::装 fonts-noto-cjk 失败——本轮 e2e 若仍红，不能排除是缺字体所致"
          fi
          echo "—— 实际可用的中文字体 ——"
          fc-list :lang=zh | head -5 || echo "（一个中文字体都没有）"

      # **不要手工先起 dev server**：Playwright 的 webServer 自己管 5181
      # （`reuseExistingServer: !process.env.CI`，CI 里是 false）。
      # 在 5181 手工起一个会让它再起一个同端口进程、--strictPort 直接失败，
      # e2e 会在什么都没改的情况下红。
      - run: yarn e2e
      - run: yarn e2e:prod

  probe:
    runs-on: ubuntu-latest
    # 本地全量 172 张约 4.7 分钟；runner 上更慢，给足。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile
      # 这个应用的中文走**系统字体栈**（src/index.css 的 --font-sans 里是 PingFang SC /
      # Noto Sans SC 等，仓库没有内置字体）。runner 上一个中文字体都没有的话，
      # 中文会以回退字形渲染——**那不是任何真实 Linux 用户看到的界面**，
      # 而横向度量（两个字有多宽）会随之改变。首跑实测：这一条让 `复盘` 标题
      # 从 macOS 的 40px 变成 30px、教学页高度变化导致可滚动距离从 >100px 变成 81px。
      # 装字体而不是调小断言：调小断言会把「安全网缩水」写进历史。
      - name: 装中文字体，并记下实际可用的（让文本度量与真实 Linux 桌面一致）
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq fonts-noto-cjk; then
            echo "::error::装 fonts-noto-cjk 失败——本轮 e2e 若仍红，不能排除是缺字体所致"
          fi
          echo "—— 实际可用的中文字体 ——"
          fc-list :lang=zh | head -5 || echo "（一个中文字体都没有）"

      # 探针**自带 dev server**（bench/ui.probe.mjs 里 5184），不需要外部起。
      # `--out ci` 是必须的：不带会去写 before/，而那份是入库基线，探针会拒绝开跑并退出 2。
      # **首跑实测：五条判据在 runner 上全部通过，且棋盘占比与本机基线逐条相同**
      # （1440×700 仍是 36.7%、390 仍是 87.2%——因为行高是写死的 CSS 值，与字体无关）。
      # 但本轮给 job 装了中文字体，**环境的改变让那次观测作废**：横向度量会变，
      # 贴着 35% 的那条余量必须重新量。所以再取一轮数才转正。
      - run: yarn ui:probe --out ci
        continue-on-error: true
      # 覆盖棘轮：扫到的状态、每行的控件与棋盘必须覆盖入库基线（少了就红）。
      # 路径注意：探针把 `--out ci` 解析成 **docs/ui-redesign/screenshots/ci/**，
      # 不是仓库根的 ci/（首跑就是接错在这里，棘轮读不到产物、退出 2）。
      # **这一步还没成功跑过一次**，所以这一轮仍不阻断——先看它真跑绿。
      - run: node quality/coverage.ratchet.mjs --current docs/ui-redesign/screenshots/ci/measurements.json
        continue-on-error: true

  bench:
    runs-on: ubuntu-latest
    # 本地约 1.5 分钟。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile
      # **首跑已在 runner 上跑通并通过**：19 条断言行一致 / 6 条跳过 / 29 项不变量一致。
      # 跳过原因里的数字证明这台 runner 明显更慢（hard|中盘 吃到预算的 93%，本机基线是 58%），
      # 而门禁没有假红——「只断言余量充足的行」这条设计被第二台机器证实。
      # 基准与字体无关，所以那次观测仍然有效 → 转成真闸门。
      - run: yarn bench
      - run: node bench/gate.mjs
